name: reconlake
version: "1.0.0"
config-version: 2
profile: reconlake
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  reconlake:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
      +post-hook: "GRANT SELECT ON {{ this }} TO analyst_masked"
