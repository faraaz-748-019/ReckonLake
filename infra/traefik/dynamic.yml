tls:
  certificates:
    - certFile: /etc/traefik/certs/local.crt
      keyFile: /etc/traefik/certs/local.key

http:
  routers:
    superset:
      rule: "Host(`superset.reconlake.local`)"
      entryPoints: ["websecure"]
      tls: {}
      service: superset-svc
    grafana:
      rule: "Host(`grafana.reconlake.local`)"
      entryPoints: ["websecure"]
      tls: {}
      service: grafana-svc

  services:
    superset-svc:
      loadBalancer:
        servers:
          - url: "http://superset:8088"
    grafana-svc:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
